<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interior Planner Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="box">

    <div id="loginBox">

        <h1>Interior Planner</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p>
            Don't have an account?
            <span onclick="showSignup()">Sign Up</span>
        </p>

    </div>


    <div id="signupBox" class="hidden">

        <h1>Interior Planner</h1>

        <h2>Create Account</h2>

        <form id="signupForm">

            <input
                type="text"
                id="signupName"
                placeholder="Name"
                required
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p id="signupMessage"></p>

        <p>
            Already have an account?
            <span onclick="showLogin()">Login</span>
        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
